x-gameserver-api-common-env: &gameserver-api-common-env
  ASPNETCORE_ENVIRONMENT: Production
  NodeAgentOptions__EnableBackgroundDiscovery: "false"
  ConnectionStrings__GameServerV2Db: Data Source=/data/gameserver-v2.db
  V2Database__Provider: Sqlite
  V2Database__ConnectionStringName: GameServerV2Db
  PortAllocation__StartPort: "25565"
  PortAllocation__EndPort: "35565"

services:
  # This sample still requires the host to be a Docker Swarm manager because
  # game server lifecycle operations are delegated to a manager-capable agent.

  gameserver-api:
    image: ghcr.io/mbulava-org/gameserver-api:latest
    container_name: gameserver-api
    ports:
      - "5164:8080"
    environment:
      <<: *gameserver-api-common-env
      BackgroundProcessing__EnableResourceCollector: "false"
    volumes:
      - gameserver-data:/data
    networks:
      - gameserver-network

  gameserver-api-background:
    image: ghcr.io/mbulava-org/gameserver-api:latest
    container_name: gameserver-api-background
    depends_on:
      - gameserver-api
    environment:
      <<: *gameserver-api-common-env
      BackgroundProcessing__EnableResourceCollector: "true"
    volumes:
      - gameserver-data:/data
    networks:
      - gameserver-network

  gameserver-web:
    image: ghcr.io/mbulava-org/gameserver-web:latest
    container_name: gameserver-web
    depends_on:
      - gameserver-api
    ports:
      - "5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GameServerDockerApi__BaseUri: http://gameserver-api:8080/
    networks:
      - gameserver-network

  gameserver-agent:
    image: ghcr.io/mbulava-org/gameserver-docker-agent:latest
    container_name: gameserver-agent
    depends_on:
      - gameserver-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AgentRegistration__Enabled: "true"
      AgentRegistration__PrimaryServiceUrl: http://gameserver-api:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gameserver-network

volumes:
  gameserver-data:

networks:
  gameserver-network:
    driver: bridge
