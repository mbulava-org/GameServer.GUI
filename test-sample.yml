version: '3.7'
## TEST Deployments — V2 Modular Stack
networks:
  exposed-services:
    external: true
    name: external-2
  gameserver-network:
    external: true
    name: gameserver-network-test

volumes:
  data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.53.235,rw,nfsvers=3,soft,sync,noatime"
      device: ":/volume1/newdev-docker/gameservers"
  postgres-data:
    driver: local

services:
  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL — V2 Database Backend
  # ────────────────────────────────────────────────────────────────────────────
  gameserver-postgres:
    image: postgres:16-alpine
    networks:
      - gameserver-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=gameserver-v2
      - POSTGRES_USER=gameserver
      - POSTGRES_PASSWORD=gameserver
    deploy:
      placement:
        constraints:
          - "node.labels.size == small"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameserver -d gameserver-v2"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────────────────────
  # Blazor Web UI
  # ────────────────────────────────────────────────────────────────────────────
  gameserver-web:
    image: mbulava/gameserver-web:latest
    ports:
      - 7071:8080
    networks:
      - exposed-services
      - gameserver-network
    environment:
      - GameServerDockerApi__BaseUri=http://gameserver-docker-test_gameserver-api:8080/
      - ASPNETCORE_ENVIRONMENT=Production
    deploy:
      placement:
        constraints:
          - "node.labels.size == small"

  # ────────────────────────────────────────────────────────────────────────────
  # REST API Host (Unified Modular Monolith)
  # Includes Catalog, Deployment, Orchestration, and Monitoring modules
  # ────────────────────────────────────────────────────────────────────────────
  gameserver-api:
    image: mbulava/gameserver-api:latest
    user: "1000:1000"
    networks:
      - gameserver-network
    ports:
      - 5163:8080
    volumes:
      - type: volume
        source: data
        target: /data
        volume:
          nocopy: true
    deploy:
      placement:
        constraints:
          - "node.labels.size == small"
    environment:
      - PortAllocation__StartPort=2000
      - PortAllocation__EndPort=65535
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Trace

      # V2 PostgreSQL database (primary)
      - V2Database__Provider=PostgreSql
      - V2Database__ConnectionStringName=GameServerV2PostgresDb
      - ConnectionStrings__GameServerV2PostgresDb=Host=gameserver-docker-test_gameserver-postgres;Database=gameserver-v2;Username=gameserver;Password=gameserver

      # Legacy SQLite fallback (optional)
      - ConnectionStrings__GameServerDb=Data Source=/data/test-data/gameserver-test.db

      # Network and Ingress Options
      - NetworkOptions__NetworkName=gameserver-network-test
      - NetworkOptions__LoadBalancerNetwork=external-2
      - NetworkOptions__LoadBalancerProvider=traefik

      # Orchestration & Agent Options
      - NodeAgentOptions__ServiceName=gameserver-docker-test_gameserver-agent
      - NodeAgentOptions__NetworkName=gameserver-network-test
      - NodeAgentOptions__Port=8080
      - NodeAgentOptions__TimeoutSeconds=45
      - NodeAgentOptions__CacheTimeoutSeconds=30
      - NodeAgentOptions__EnableBackgroundDiscovery=false
      - ServiceOperations__Mode=Agent

  # ────────────────────────────────────────────────────────────────────────────
  # Node Agent — One replica per swarm node (global mode)
  # ────────────────────────────────────────────────────────────────────────────
  gameserver-agent:
    image: mbulava/gameserver-docker-agent:latest
    deploy:
      mode: global  # Deploy one replica per node
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gameserver-network
    environment:
      - NODE_NAME={{.Node.Hostname}}
      - NODE_ID={{.Node.ID}}
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Logging__LogLevel__Default=Trace
      - Logging__LogLevel__Microsoft.AspNetCore=Information
      - ContainerStatsStreamOptions__MaxStreamDurationSeconds=10
      - AgentRegistration__PrimaryServiceUrl=http://gameserver-docker-test_gameserver-api:8080/
      - AgentRegistration__HeartbeatIntervalSeconds=30
      - AgentRegistration__Enabled=true
      - AgentRegistration__MaxStartupRetries=20

  # ────────────────────────────────────────────────────────────────────────────
  # Optional Standalone Microservices (Phase 2 Expanded Topology)
  # Uncomment when promoting to distributed service architecture
  # ────────────────────────────────────────────────────────────────────────────
  # gameserver-orchestration:
  #   image: mbulava/gameserver-orchestration:latest
  #   networks:
  #     - gameserver-network
  #   ports:
  #     - 5165:8080
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - NodeAgentOptions__ServiceName=gameserver-docker-test_gameserver-agent
  #     - NodeAgentOptions__NetworkName=gameserver-network-test
  #     - NodeAgentOptions__Port=8080
  #
  # gameserver-monitoring:
  #   image: mbulava/gameserver-monitoring:latest
  #   networks:
  #     - gameserver-network
  #   ports:
  #     - 5166:8080
  #   environment:
  #     - ASPNETCORE_ENVIRONMENT=Production
  #     - V2Database__Provider=PostgreSql
  #     - V2Database__ConnectionStringName=GameServerV2PostgresDb
  #     - ConnectionStrings__GameServerV2PostgresDb=Host=gameserver-docker-test_gameserver-postgres;Database=gameserver-v2;Username=gameserver;Password=gameserver

