name: 'Build and Publish Docker Image'

on:
  workflow_dispatch:
    inputs:
      force_publish:
        default: false
        type: boolean
        description: 'Force build and Publish of projects even if no changes have been detected.'

  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  packages: write
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# We want to make some updates so we only Determine the version once and Only rebuild containers IF there are changes in the source...
# But we should always Build and Test
jobs:
   # Configuration job - Single source of truth for all workflow variables
  setup:
    runs-on: ubuntu-latest
    env:
      DOTNET_VERSION: '10.0.x'
      SEMANTIC_VERSION: '0.1.0.120'
      PRIMARY_BRANCH: 'main'
      FORCE_PUSH_CLIENT: false
    outputs:
      dotnet_version: ${{ steps.config.outputs.dotnet_version }}
      semantic_version: ${{ steps.config.outputs.semantic_version }}
      primary_branch: ${{ steps.config.outputs.primary_branch }}
      push_client_output: ${{ steps.detect-api-changes.outputs.push_client_output }}
      new_version: ${{ steps.config.outputs.new_version }}
      # Project change detection outputs (actual changes)
      backend_changed: ${{ steps.detect-project-changes.outputs.backend_changed }}
      agent_changed: ${{ steps.detect-project-changes.outputs.agent_changed }}
      web_changed: ${{ steps.detect-project-changes.outputs.web_changed }}
      client_changed: ${{ steps.detect-project-changes.outputs.client_changed }}
      tests_changed: ${{ steps.detect-project-changes.outputs.tests_changed }}
      # Push decision outputs (changes OR force_publish)
      push_backend: ${{ steps.calculate-push-decisions.outputs.push_backend }}
      push_agent: ${{ steps.calculate-push-decisions.outputs.push_agent }}
      push_web: ${{ steps.calculate-push-decisions.outputs.push_web }}
      push_client: ${{ steps.calculate-push-decisions.outputs.push_client }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history to compare changes
      
      - name: Set configuration values
        id: config
        run: |
          echo "dotnet_version=${{ env.DOTNET_VERSION }}" >> $GITHUB_OUTPUT
          echo "semantic_version=${{ env.SEMANTIC_VERSION }}" >> $GITHUB_OUTPUT
          echo "primary_branch=${{ env.PRIMARY_BRANCH }}" >> $GITHUB_OUTPUT
          echo "Calculating new version based on semantic versioning..."
          IFS='.' read -ra arr <<< "${{ env.SEMANTIC_VERSION }}"
          inc=${{ github.run_number }}
          old=${arr[3]}
          build="$(( inc + old ))"
          newV=${arr[0]}.${arr[1]}.${arr[2]}.$build
          echo "NEW_VERSION=$newV" >> $GITHUB_ENV
          echo "new_version=$newV" >> $GITHUB_OUTPUT
          echo "VERSION_BUILD=$build" >> $GITHUB_ENV
          echo "VERSION_MAJOR=${arr[0]}" >> $GITHUB_ENV
          echo "VERSION_MINOR=${arr[1]}" >> $GITHUB_ENV
          echo "VERSION_PATCH=${arr[2]}" >> $GITHUB_ENV
          echo "Successfully parsed ${{ env.SEMANTIC_VERSION }} and calculated new value $newV"
          echo "Successfully calculated VERSION_BUILD value $build"
          echo "Successfully calculated VERSION_MAJOR value ${arr[0]}"
          echo "Successfully calculated VERSION_MINOR value ${arr[1]}"
          echo "Successfully calculated VERSION_PATCH value ${arr[2]}"
      
      - name: Detect API changes
        id: detect-api-changes
        run: |
          # Check if this is a manual dispatch with force push
          if [ "${{ env.FORCE_PUSH_CLIENT }}" == "true" ]; then
            echo "::warning::Client package publish FORCED via manual dispatch"
            echo "push_client_output=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # For pull requests, compare against base branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
          else
            # For pushes, compare current commit with previous
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.sha }}"
          fi
          
          echo "Comparing $BASE_REF...$HEAD_REF"
          
          # Check if API-related files changed (Controllers, Models, DTOs, Interfaces that define contracts)
          API_FILES_CHANGED=$(git diff --name-only $BASE_REF $HEAD_REF | grep -E '(Controllers/|Models/|DTOs/|Interfaces/.*Manager|Interfaces/.*Monitor|Interfaces/.*Registry)' || true)
          
          if [ -n "$API_FILES_CHANGED" ]; then
            echo "::warning::?? API signature changes detected - Client package will be published! HOPE YOU DIDN'T BREAK COMPATIBILITY!!!"
            echo "API-related files changed:"
            echo "$API_FILES_CHANGED"
            # Show changed files in the warning
            CHANGED_FILES_LIST=$(echo "$API_FILES_CHANGED" | tr '\n' ', ' | sed 's/,$//')
            echo "::warning file=API Changes::Changed files: $CHANGED_FILES_LIST"
            echo "push_client_output=true" >> $GITHUB_OUTPUT
          else
            echo "? No API-related files changed - skipping client publish"
            echo "push_client_output=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect project folder changes
        id: detect-project-changes
        run: |
          # Determine base and head refs for comparison
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
          else
            # For pushes, compare current commit with previous
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.sha }}"
          fi

          # workflow_dispatch has no 'before', and the first push to a branch reports the
          # all-zero SHA. Fall back to the previous commit so the diff still resolves.
          if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$(git rev-parse ${HEAD_REF}^ 2>/dev/null || echo '')"
          fi

          if [ -z "$BASE_REF" ]; then
            echo "::notice::No comparable base commit - treating all projects as changed"
            CHANGED_FILES="$(git ls-files)"
          else
            echo "Detecting project changes between $BASE_REF...$HEAD_REF"
            CHANGED_FILES=$(git diff --name-only "$BASE_REF" "$HEAD_REF" || true)
          fi

          # Detect changes in each project folder
          BACKEND_CHANGED="false"
          AGENT_CHANGED="false"
          WEB_CHANGED="false"
          CLIENT_CHANGED="false"
          TESTS_CHANGED="false"


          if echo "$CHANGED_FILES" | grep -qE '^src/GameServer\.Docker/'; then
            BACKEND_CHANGED="true"
            echo "::notice::✅ GameServer.Docker project has changes"
          fi

          # Check GameServer.Docker.Agent (agent-backend)
          if echo "$CHANGED_FILES" | grep -qE '^src/GameServer\.Docker\.Agent/'; then
            AGENT_CHANGED="true"
            echo "::notice::✅ GameServer.Docker.Agent project has changes"
          fi

          # Check GameServer.Web (web-gui)
          if echo "$CHANGED_FILES" | grep -qE '^src/GameServer\.Web/'; then
            WEB_CHANGED="true"
            echo "::notice::✅ GameServer.Web project has changes"
          fi

          # Check GameServer.Docker.Client
          if echo "$CHANGED_FILES" | grep -qE '^src/GameServer\.Docker\.Client/'; then
            CLIENT_CHANGED="true"
            echo "::notice::✅ GameServer.Docker.Client project has changes"
          fi

          # Check any test projects
          if echo "$CHANGED_FILES" | grep -qE '^tests/'; then
            TESTS_CHANGED="true"
            echo "::notice::✅ Test projects have changes"
          fi

          # Output results
          echo "backend_changed=$BACKEND_CHANGED" >> $GITHUB_OUTPUT
          echo "agent_changed=$AGENT_CHANGED" >> $GITHUB_OUTPUT
          echo "web_changed=$WEB_CHANGED" >> $GITHUB_OUTPUT
          echo "client_changed=$CLIENT_CHANGED" >> $GITHUB_OUTPUT
          echo "tests_changed=$TESTS_CHANGED" >> $GITHUB_OUTPUT

          # Summary
          echo "📊 Project Change Detection Summary:"
          echo "  - Backend (GameServer.Docker): $BACKEND_CHANGED"
          echo "  - Agent (GameServer.Docker.Agent): $AGENT_CHANGED"
          echo "  - Web (GameServer.Web): $WEB_CHANGED"
          echo "  - Client (GameServer.Docker.Client): $CLIENT_CHANGED"
          echo "  - Tests: $TESTS_CHANGED"

      - name: Calculate push decisions
        id: calculate-push-decisions
        run: |
          # Get the force_publish input (defaults to false if not set)
          FORCE_PUBLISH="${{ github.event.inputs.force_publish || 'false' }}"

          # Get change detection results
          BACKEND_CHANGED="${{ steps.detect-project-changes.outputs.backend_changed }}"
          AGENT_CHANGED="${{ steps.detect-project-changes.outputs.agent_changed }}"
          WEB_CHANGED="${{ steps.detect-project-changes.outputs.web_changed }}"
          CLIENT_CHANGED="${{ steps.detect-project-changes.outputs.client_changed }}"
          TESTS_CHANGED="${{ steps.detect-project-changes.outputs.tests_changed }}"

          echo "🔍 Push Decision Calculation:"
          echo "  - Force Publish: $FORCE_PUBLISH"
          echo "  - Tests Changed: $TESTS_CHANGED"

          # Calculate push decisions: (project changed) OR (tests changed) OR (force publish)
          if [ "$BACKEND_CHANGED" = "true" ] || [ "$TESTS_CHANGED" = "true" ] || [ "$FORCE_PUBLISH" = "true" ]; then
            echo "push_backend=true" >> $GITHUB_OUTPUT
            echo "  ✅ Backend will be pushed (changed=$BACKEND_CHANGED, tests=$TESTS_CHANGED, force=$FORCE_PUBLISH)"
          else
            echo "push_backend=false" >> $GITHUB_OUTPUT
            echo "  ⏭️  Backend push skipped (no changes, not forced)"
          fi

          if [ "$AGENT_CHANGED" = "true" ] || [ "$TESTS_CHANGED" = "true" ] || [ "$FORCE_PUBLISH" = "true" ]; then
            echo "push_agent=true" >> $GITHUB_OUTPUT
            echo "  ✅ Agent will be pushed (changed=$AGENT_CHANGED, tests=$TESTS_CHANGED, force=$FORCE_PUBLISH)"
          else
            echo "push_agent=false" >> $GITHUB_OUTPUT
            echo "  ⏭️  Agent push skipped (no changes, not forced)"
          fi

          if [ "$WEB_CHANGED" = "true" ] || [ "$TESTS_CHANGED" = "true" ] || [ "$FORCE_PUBLISH" = "true" ]; then
            echo "push_web=true" >> $GITHUB_OUTPUT
            echo "  ✅ Web will be pushed (changed=$WEB_CHANGED, tests=$TESTS_CHANGED, force=$FORCE_PUBLISH)"
          else
            echo "push_web=false" >> $GITHUB_OUTPUT
            echo "  ⏭️  Web push skipped (no changes, not forced)"
          fi

          if [ "$CLIENT_CHANGED" = "true" ] || [ "$TESTS_CHANGED" = "true" ] || [ "$FORCE_PUBLISH" = "true" ]; then
            echo "push_client=true" >> $GITHUB_OUTPUT
            echo "  ✅ Client will be pushed (changed=$CLIENT_CHANGED, tests=$TESTS_CHANGED, force=$FORCE_PUBLISH)"
          else
            echo "push_client=false" >> $GITHUB_OUTPUT
            echo "  ⏭️  Client push skipped (no changes, not forced)"
          fi

      - name: Write build summary
        id: build-summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          
          ## 🏗️ Build Configuration

          | Setting | Value |
          | ------- | ----- |
          | **Version** | ${{ steps.config.outputs.new_version }} |
          | **Build Number** | ${{ env.VERSION_BUILD }} |
          | **Semantic Base** | ${{ env.SEMANTIC_VERSION }} |
          | **Run Number** | ${{ github.run_number }} |
          | **.NET Version** | ${{ env.DOTNET_VERSION }} |

          ---

          ## 📦 Push Decisions

          | Project | Changed | Force | **Will Push** |
          | ------- | ------- | ----- | ------------- |
          | Backend (GameServer.Docker) | ${{ steps.detect-project-changes.outputs.backend_changed }} | ${{ github.event.inputs.force_publish || 'false' }} | **`${{ steps.calculate-push-decisions.outputs.push_backend }}`** |
          | Agent (GameServer.Docker.Agent) | ${{ steps.detect-project-changes.outputs.agent_changed }} | ${{ github.event.inputs.force_publish || 'false' }} | **`${{ steps.calculate-push-decisions.outputs.push_agent }}`** |
          | Web (GameServer.Web) | ${{ steps.detect-project-changes.outputs.web_changed }} | ${{ github.event.inputs.force_publish || 'false' }} | **`${{ steps.calculate-push-decisions.outputs.push_web }}`** |
          | Client (GameServer.Docker.Client) | ${{ steps.detect-project-changes.outputs.client_changed }} | ${{ github.event.inputs.force_publish || 'false' }} | **`${{ steps.calculate-push-decisions.outputs.push_client }}`** |
          | Tests | ${{ steps.detect-project-changes.outputs.tests_changed }} | — | _(runs always)_ |
          EOF

  test:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.setup.outputs.dotnet_version }}
          source-url: https://nuget.pkg.github.com/mbulava-org/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dependencies
        run: dotnet restore GameServer.GUI.slnx

      # # Workaround: MSBuild.Sdk.PostgreSql 1.0.0-preview3 ships only Windows native
      # # libraries (win-x64). On Linux the pgpac compiler cannot find libpg_query_17.so
      # # and exits with code 1. The mbulava.postgresql.dac package (restored above as a
      # # transitive dep) already contains the correct linux-x64 .so files — copy them
      # # into the location the SDK tasks DLL searches at build time.
      # # Track: upgrade MSBuild.Sdk.PostgreSql when a version that ships linux libs lands.
      #   run: |
      #     NUGET_CACHE="${HOME}/.nuget/packages"
      #     SDK_VER="1.0.0-preview3"
      #     DAC_VER="1.0.0-preview9"
      #     SRC="$NUGET_CACHE/mbulava.postgresql.dac/$DAC_VER/runtimes/linux-x64/native"
      #     DST="$NUGET_CACHE/msbuild.sdk.postgresql/$SDK_VER/tasks/net10.0/runtimes/linux-x64/native"
      #     if [ -d "$SRC" ] && [ -d "$NUGET_CACHE/msbuild.sdk.postgresql/$SDK_VER" ]; then
      #       mkdir -p "$DST"
      #       cp "$SRC/libpg_query_16.so" "$DST/" 2>/dev/null || true
      #       cp "$SRC/libpg_query_17.so" "$DST/" 2>/dev/null || true
      #       echo "Copied linux-x64 native libs to $DST"
      #       ls "$DST"
      #     else
      #       echo "Source or SDK package dir not found — skipping (DB project excluded from solution build)"
      #     fi

      - name: Build solution
        run: dotnet build GameServer.GUI.slnx --no-restore --configuration Release

      - name: Run tests (excluding Testcontainers/Docker-socket tests)
        run: |
          # Run each test project separately so every project writes its own
          # uniquely-named .trx file (a shared LogFileName would overwrite).
          # All coverage.cobertura.xml files still land under ./test-results and
          # are combined by the coverage report step below.
          overall=0
          for proj in $(find tests -name '*.Tests.csproj' | sort); do
            name=$(basename "$proj" .csproj)
            echo "::group::Testing $name"
            dotnet test "$proj" \
              --no-build --configuration Release \
              --filter "FullyQualifiedName!~MySqlContainer&FullyQualifiedName!~PostgreSqlContainer&FullyQualifiedName!~MySqlTests&FullyQualifiedName!~PostgreSqlTests&Category!=PostgreSql" \
              --logger "trx;LogFileName=${name}.trx" \
              --collect:"XPlat Code Coverage" \
              --results-directory ./test-results || overall=1
            echo "::endgroup::"
          done
          exit $overall

      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"./test-results/**/coverage.cobertura.xml" \
            -targetdir:"./coverage-report" \
            -reporttypes:"Html;Cobertura;MarkdownSummaryGithub;TextSummary"

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f ./coverage-report/SummaryGithub.md ]; then
            cat ./coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage summary was produced." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: ./test-results/*.trx

      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: code-coverage-report
          path: |
            ./coverage-report/**
            ./test-results/**/coverage.cobertura.xml

  backend:
    needs: [setup]
    if: needs.setup.outputs.push_backend == 'true'
    uses: ./.github/workflows/BuildAndPublish-Docker-Local.yaml
    secrets: inherit
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      semantic_version: ${{ needs.setup.outputs.new_version }}
      docker_context: './src/GameServer.Docker'
      primary_branch: ${{ needs.setup.outputs.primary_branch }}
      push_output: ${{ needs.setup.outputs.push_backend == 'true' }}
      push_branch: true
      version_tag: false
      semantic_version_rollup_tag: false 
      target_repo: 'gameserver-docker'

  agent-backend:
    needs: [setup]
    if: needs.setup.outputs.push_agent == 'true'
    uses: ./.github/workflows/BuildAndPublish-Docker-Local.yaml
    secrets: inherit
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      semantic_version: ${{ needs.setup.outputs.new_version }}
      docker_context: './src/GameServer.Docker.Agent'
      primary_branch: ${{ needs.setup.outputs.primary_branch }}
      push_output: ${{ needs.setup.outputs.push_agent == 'true' }}
      push_branch: true
      version_tag: false
      semantic_version_rollup_tag: false 
      target_repo: 'gameserver-docker-agent'

  #The doesn't need to build/publish, it's a simple project reference in the Web-GUI now.
  # client:
  #   needs: setup
  #   uses: mbulava-org/action-templates/.github/workflows/BuildTestPublish-DotNet.yaml@main
  #   secrets: inherit
  #   with:
  #     dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
  #     semantic_version: ${{ needs.setup.outputs.semantic_version }}
  #     push_output: ${{ needs.setup.outputs.push_client_output == 'true' }}
  #     push_branch: false
  #     disable_tests: false

  web-gui:
    needs: [setup]
    if: needs.setup.outputs.push_web == 'true'
    uses: ./.github/workflows/BuildAndPublish-Docker-Local.yaml
    secrets: inherit
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      semantic_version: ${{ needs.setup.outputs.new_version }}
      docker_context: '.'
      docker_file: './src/GameServer.Web/Dockerfile'
      primary_branch : ${{ needs.setup.outputs.primary_branch }}
      push_output: ${{ needs.setup.outputs.push_web == 'true' }}
      push_branch: true
      version_tag: true
      semantic_version_rollup_tag: false 
      target_repo: 'gameserver-web'
