name: 'Build and Publish Docker Image'

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  packages: write
  contents: write

jobs:
   # Configuration job - Single source of truth for all workflow variables
  setup:
    runs-on: ubuntu-latest
    env:
      DOTNET_VERSION: '10.0.x'
      SEMANTIC_VERSION: '0.0.4.120'
      PRIMARY_BRANCH: 'main'
      FORCE_PUSH_CLIENT: false
    outputs:
      dotnet_version: ${{ steps.config.outputs.dotnet_version }}
      semantic_version: ${{ steps.config.outputs.semantic_version }}
      primary_branch: ${{ steps.config.outputs.primary_branch }}
      push_client_output: ${{ steps.detect-api-changes.outputs.push_client_output }}
      new_version: ${{ steps.config.outputs.new_version }} 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to compare changes
      
      - name: Set configuration values
        id: config
        run: |
          echo "dotnet_version=${{ env.DOTNET_VERSION }}" >> $GITHUB_OUTPUT
          echo "semantic_version=${{ env.SEMANTIC_VERSION }}" >> $GITHUB_OUTPUT
          echo "primary_branch=${{ env.PRIMARY_BRANCH }}" >> $GITHUB_OUTPUT
          echo "Calculating new version based on semantic versioning..."
          IFS='.'
          read -ra arr <<< ${{ env.SEMANTIC_VERSION }}
          inc=${{ github.run_number }}
          old=${arr[3]}
          build="$(( inc + old ))"
          newV=${arr[0]}.${arr[1]}.${arr[2]}.$build
          IFS=" "
          echo "NEW_VERSION=$newV" >> $GITHUB_ENV
          echo "VERSION_BUILD=$build" >> $GITHUB_ENV
          echo "VERSION_MAJOR=${arr[0]}" >> $GITHUB_ENV
          echo "VERSION_MINOR=${arr[1]}" >> $GITHUB_ENV
          echo "VERSION_PATCH=${arr[2]}" >> $GITHUB_ENV
          echo "Successfully parsed ${{ env.SEMANTIC_VERSION }} and calculated new value $newV"
          echo "Successfully calculated VERSION_BUILD value $build"
          echo "Successfully calculated VERSION_MAJOR value ${arr[0]}"
          echo "Successfully calculated VERSION_MINOR value ${arr[1]}"
          echo "Successfully calculated VERSION_PATCH value ${arr[2]}"
      
      - name: Detect API changes
        id: detect-api-changes
        run: |
          # Check if this is a manual dispatch with force push
          if [ "${{ env.FORCE_PUSH_CLIENT }}" == "true" ]; then
            echo "::warning::Client package publish FORCED via manual dispatch"
            echo "push_client_output=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # For pull requests, compare against base branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
          else
            # For pushes, compare current commit with previous
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.sha }}"
          fi
          
          echo "Comparing $BASE_REF...$HEAD_REF"
          
          # Check if API-related files changed (Controllers, Models, DTOs, Interfaces that define contracts)
          API_FILES_CHANGED=$(git diff --name-only $BASE_REF $HEAD_REF | grep -E '(Controllers/|Models/|DTOs/|Interfaces/.*Manager|Interfaces/.*Monitor|Interfaces/.*Registry)' || true)
          
          if [ -n "$API_FILES_CHANGED" ]; then
            echo "::warning::?? API signature changes detected - Client package will be published! HOPE YOU DIDN'T BREAK COMPATIBILITY!!!"
            echo "API-related files changed:"
            echo "$API_FILES_CHANGED"
            # Show changed files in the warning
            CHANGED_FILES_LIST=$(echo "$API_FILES_CHANGED" | tr '\n' ', ' | sed 's/,$//')
            echo "::warning file=API Changes::Changed files: $CHANGED_FILES_LIST"
            echo "push_client_output=true" >> $GITHUB_OUTPUT
          else
            echo "? No API-related files changed - skipping client publish"
            echo "push_client_output=false" >> $GITHUB_OUTPUT
          fi

  backend:
    needs: [setup]
    uses: mbulava-org/action-templates/.github/workflows/BuildAndPublish-Docker.yaml@main
    secrets: inherit
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      semantic_version: ${{ needs.setup.outputs.semantic_version }}
      docker_context: './src/GameServer.Docker'
      primary_branch: ${{ needs.setup.outputs.primary_branch }}
      push_output: true
      push_branch: true
      version_tag: false
      semantic_version_rollup_tag: false 
      target_repo: 'gameserver-docker' 

  agent-backend:
    needs: [setup]
    uses: mbulava-org/action-templates/.github/workflows/BuildAndPublish-Docker.yaml@main
    secrets: inherit
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      semantic_version: ${{ needs.setup.outputs.semantic_version }}
      docker_context: './src/GameServer.Docker.Agent'
      primary_branch: ${{ needs.setup.outputs.primary_branch }}
      push_output: true
      push_branch: true
      version_tag: false
      semantic_version_rollup_tag: false 
      target_repo: 'gameserver-docker-agent'

  #The doesn't need to build/publish, it's a simple project reference in the Web-GUI now.
  # client:
  #   needs: setup
  #   uses: mbulava-org/action-templates/.github/workflows/BuildTestPublish-DotNet.yaml@main
  #   secrets: inherit
  #   with:
  #     dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
  #     semantic_version: ${{ needs.setup.outputs.semantic_version }}
  #     push_output: ${{ needs.setup.outputs.push_client_output == 'true' }}
  #     push_branch: false
  #     disable_tests: false

  web-gui:
    needs: [setup]
    uses: mbulava-org/action-templates/.github/workflows/BuildAndPublish-Docker.yaml@main
    secrets: inherit
    with:
      dotnet_version: ${{ needs.setup.outputs.dotnet_version }}
      semantic_version: ${{ needs.setup.outputs.semantic_version }}
      docker_context: '.'
      docker_file: './src/GameServer.Web/Dockerfile'
      primary_branch : ${{ needs.setup.outputs.primary_branch }}
      push_output: true
      push_branch: true
      version_tag: true
      semantic_version_rollup_tag: false 
      target_repo: 'gameserver-web'   